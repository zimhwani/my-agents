name: Flight agent site

# Publishes the flight agent's built page (flight-agent/edge/bundle/page.html) to
# GitHub Pages. The page calls the hosted API (a Supabase Edge Function) directly.

on:
  push:
    branches: [main, claude/sweet-keller-umk8c5]
    paths:
      - "flight-agent/edge/bundle/page.html"
      - ".github/workflows/flight-agent-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site
          cp flight-agent/edge/bundle/page.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
