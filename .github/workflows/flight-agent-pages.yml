name: Flight agent site

# Publishes the flight agent's built page (flight-agent/edge/bundle/page.html) to
# the gh-pages branch, which GitHub Pages serves at
# https://zimhwani.github.io/my-agents/ . The page calls the hosted API
# (a Supabase Edge Function) directly.

on:
  push:
    branches: [main, claude/sweet-keller-umk8c5]
    paths:
      - "flight-agent/edge/bundle/page.html"
      - ".github/workflows/flight-agent-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-agent-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site
          cp flight-agent/edge/bundle/page.html site/index.html
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "flight-agent-bot"
          git config user.email "flight-agent-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish flight agent page from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
