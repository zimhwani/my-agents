name: Deploy Mati Chinyanda site to Vercel

# Deploys the static site in mati-chinyanda/ to Vercel on every push that touches it.
# Until the secrets below exist, the job no-ops (it never fails a push).
#
# One-time setup — add as GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — create at vercel.com/account/tokens
#   VERCEL_ORG_ID       — Vercel team/user id (Vercel → Settings → General)
#   VERCEL_PROJECT_ID_MATI (optional) — pin deploys to the project once it exists.
#
# Zero-secret alternative: Vercel → Add New → Project → import this repo, set
# Root Directory = mati-chinyanda. See mati-chinyanda/README.md.

on:
  push:
    branches: [main, claude/awesome-faraday-syn8sp]
    paths:
      - "mati-chinyanda/**"
      - ".github/workflows/mati-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MATI }}
    steps:
      - uses: actions/checkout@v4

      - if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret not set — skipping deploy. See mati-chinyanda/README.md."

      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: env.VERCEL_TOKEN != ''
        name: Deploy to Vercel (production)
        working-directory: mati-chinyanda
        run: |
          npm i -g vercel@latest
          if [ -n "$VERCEL_PROJECT_ID" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          fi
