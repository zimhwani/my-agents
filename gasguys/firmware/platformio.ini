; Gasguys smart valve firmware (ESP32). Bench build uses Wi-Fi; field build uses a SIM7070G modem.
;   pio run -e bench -t upload      pio device monitor
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7
  bogde/HX711 @ ^0.7.5
  chris--a/Keypad @ ^3.1.1

[env:bench]
build_flags = -DGG_TRANSPORT_WIFI

[env:field]
build_flags = -DGG_TRANSPORT_CELLULAR -DTINY_GSM_MODEM_SIM7080
lib_deps =
  ${env.lib_deps}
  vshymanskyy/TinyGSM @ ^0.12
