# Fallback for anyone who prefers XcodeGen (brew install xcodegen; xcodegen generate).
# The committed HairDone.xcodeproj already works in Xcode 16 without this.
name: HairDone
options:
  bundleIdPrefix: com.hairdone
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
targets:
  HairDone:
    type: application
    platform: iOS
    sources:
      - path: HairDone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hairdone.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Hair Done"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "So we can show you who's near you right now. We never share your location with anyone."
        INFOPLIST_KEY_NSCameraUsageDescription: "So you can add photos of your work, or show a pro the look you're after."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "So you can add inspo photos to a booking, or show off your work."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
