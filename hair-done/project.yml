# The project file is generated from this: `xcodegen generate`, then open
# HairDone.xcodeproj. The .xcodeproj is gitignored so a stale one can't be what
# gets shipped. Same arrangement as the golf-caddy repo.
name: HairDone
options:
  bundleIdPrefix: com.keithchinyanda
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: HairDone.xcconfig
  Release: HairDone.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Lives in the ignored HairDone.xcconfig, not here: `xcodegen generate`
    # rewrites the project file, so a team picked in Xcode's UI is lost on
    # the next regen.
    DEVELOPMENT_TEAM: $(HAIRDONE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  HairDone:
    type: application
    platform: iOS
    sources:
      - path: HairDone
    info:
      path: HairDone/Resources/Info.plist
      properties:
        # References, not literals, so `xcodebuild CURRENT_PROJECT_VERSION=12`
        # reaches the bundle. A literal here is accepted and silently ignored,
        # and App Store Connect then rejects the upload as a duplicate build.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Hair Done
        # The system launch screen shows before any of our code runs. Left
        # empty it defaults to white; paper in light, ink in dark instead.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription:
          Hair Done shows pros near you and works out travel fees. Only while you're in the app.
        NSCameraUsageDescription:
          So you can add photos of your work, or show a pro the look you're after.
        NSPhotoLibraryUsageDescription:
          So you can add inspo photos to a booking, or show off your work.
        # Declared once so App Store Connect stops asking on every upload.
        # The only cryptography is HTTPS through URLSession, which is exempt.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithchinyanda.hairdone
        # iPhone only. Portrait alone, laid out for a phone width.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  HairDone:
    build:
      targets:
        HairDone: all
    run:
      config: Debug
    archive:
      config: Release
